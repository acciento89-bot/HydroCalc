name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Project rules and protected storage
        run: bash Tests/run-core-tests.sh
      - name: Build HydroCalc
        run: |
          xcodebuild \
            -project HydroCalc.xcodeproj \
            -scheme HydroCalc \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
